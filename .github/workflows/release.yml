name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64 (glibc 2.17)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in glibc 2.17 userspace
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e CARGO_HOME=/tmp/cargo \
            -e RUSTUP_HOME=/tmp/rustup \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.92.0

              source /tmp/cargo/env

              rustc --version
              ldd --version | head -1

              cargo build \
                --locked \
                --release \
                --bin xp3brute \
                --target x86_64-unknown-linux-gnu
            '

      - name: Verify glibc requirement
        shell: bash
        run: |
          set -euo pipefail

          binary=target/x86_64-unknown-linux-gnu/release/xp3brute

          max_glibc="$({
            readelf --version-info "$binary" || true
          } \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
            | sed 's/^GLIBC_//' \
            | sort -Vu \
            | tail -1 || true)"

          echo "highest referenced GLIBC version: ${max_glibc:-none}"

          if [[ -n "$max_glibc" ]]; then
            highest="$(printf '%s\n' 2.17 "$max_glibc" | sort -V | tail -1)"

            if [[ "$highest" != "2.17" ]]; then
              echo "Linux binary requires GLIBC_$max_glibc; expected GLIBC_2.17 or older" >&2
              exit 1
            fi
          fi

      - name: Package Linux binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            build_id="$GITHUB_REF_NAME"
          else
            build_id="manual-${GITHUB_SHA:0:7}"
          fi

          target=x86_64-unknown-linux-gnu
          package="xp3brute-${build_id}-${target}"

          mkdir -p "$package"
          cp "target/${target}/release/xp3brute" "$package/"
          cp README.md THIRD_PARTY_NOTICES.md "$package/"

          tar -czf "${package}.tar.gz" "$package"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp3brute-x86_64-unknown-linux-gnu
          path: xp3brute-*-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --bin xp3brute --target ${{ matrix.target }}

      - name: Package macOS binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            build_id="$GITHUB_REF_NAME"
          else
            build_id="manual-${GITHUB_SHA:0:7}"
          fi

          package="xp3brute-${build_id}-${TARGET}"

          mkdir -p "$package"
          cp "target/${TARGET}/release/xp3brute" "$package/"
          cp README.md THIRD_PARTY_NOTICES.md "$package/"

          tar -czf "${package}.tar.gz" "$package"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $buildId = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "manual-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $package = "xp3brute-$buildId-$env:TARGET"

          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item "target/$env:TARGET/release/xp3brute.exe" "$package/"
          Copy-Item README.md "$package/"
          Copy-Item THIRD_PARTY_NOTICES.md "$package/"

          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp3brute-${{ matrix.target }}
          path: xp3brute-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-linux
      - build-native

    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xp3brute-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum xp3brute-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
