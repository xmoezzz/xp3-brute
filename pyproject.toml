[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "xp3-brute"
version = "0.3.7"
description = "Native Python bindings for xp3-brute"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "xp3_brute"
